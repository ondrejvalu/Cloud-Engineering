<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BookStack Cloud Sandbox</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 2rem; border-radius: 12px; max-width: 440px; width: 90%; box-shadow: 0 10px 25px rgba(0,0,0,0.4); text-align: center; }
    h1 { margin-top: 0; font-size: 1.5rem; }
    p { color: #94a3b8; line-height: 1.5; }
    .status { margin: 1.5rem 0; padding: 1rem; border-radius: 8px; background: #0f172a; font-family: monospace; font-size: 0.95rem; }
    button, a.btn { display: inline-block; width: 100%; box-sizing: border-box; padding: 0.85rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; text-decoration: none; transition: 0.2s; }
    #startBtn { background: #3b82f6; color: white; }
    #startBtn:hover:not(:disabled) { background: #2563eb; }
    #startBtn:disabled { background: #475569; cursor: not-allowed; }
    #openBtn { background: #10b981; color: white; margin-top: 0.75rem; display: none; }
    #openBtn:hover { background: #059669; }
  </style>
</head>
<body>
  <div class="card">
    <h1>BookStack On-Demand Sandbox</h1>
    <p>Prostředí se spouští na vyžádání ze Zero-Secret Golden Image a po 10 minutách se samo uklidí.</p>
    <div class="status" id="statusBox">Kontroluji stav...</div>
    <button id="startBtn" onclick="startSandbox()" disabled>Spustit Sandbox</button>
    <a id="openBtn" class="btn" href="http://51.15.128.128" target="_blank">Otevřít BookStack ↗</a>
  </div>

  <script>
    const API_BASE = "https://scw-sandbox-api-cz-d4gwghcbhpa6fdec.westeurope-01.azurewebsites.net/api";
    const statusBox = document.getElementById("statusBox");
    const startBtn = document.getElementById("startBtn");
    const openBtn = document.getElementById("openBtn");

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m}:${s.toString().padStart(2, "0")}`;
    }

    async function checkStatus() {
      try {
        const res = await fetch(`${API_BASE}/StatusCheck`);
        const data = await res.json();

        if (data.active) {
          startBtn.disabled = true;
          startBtn.textContent = "Sandbox běží";
          statusBox.innerHTML = `Stav: <strong>${data.state}</strong><br>Zbývá do vypnutí: <strong>${formatTime(data.remainingSeconds)}</strong>`;
          openBtn.style.display = data.state === "running" ? "inline-block" : "none";
        } else {
          startBtn.disabled = false;
          startBtn.textContent = "Spustit Sandbox";
          statusBox.textContent = "Stav: Vypnuto (připraveno ke startu)";
          openBtn.style.display = "none";
        }
      } catch (err) {
        statusBox.textContent = "Chyba komunikace s API (zkontrolujte CORS).";
      }
    }

    async function startSandbox() {
      startBtn.disabled = true;
      startBtn.textContent = "Startuji VM...";
      statusBox.textContent = "Odesílám požadavek do Scaleway (cca 60–90 s do naběhnutí)...";
      try {
        await fetch(`${API_BASE}/StartSandbox`, { method: "POST" });
        setTimeout(checkStatus, 3000);
      } catch (err) {
        statusBox.textContent = "Nepodařilo se spustit sandbox.";
        startBtn.disabled = false;
      }
    }

    checkStatus();
    setInterval(checkStatus, 5000);
  </script>
</body>
</html>
